# Cloudflare Tunnel — Docker connector (recommended on this PC).
# Enable: COMPOSE_PROFILES=optimizer,cloudflare + CLOUDFLARE_TUNNEL_TOKEN in .env
#
# Dashboard → Published application routes → photos.miraz.dev → http://immich-upload-optimizer:2283
# Requires: Windows Cloudflared service disabled; Happ VPN happ-tun adapter off when VPN closed.
# Fallback (host connector): scripts/run-cloudflared-windows.ps1 → route http://127.0.0.1:2283
# Docs: docs/REMOTE_ACCESS.md, docs/CLOUDFLARE-FIX.md

services:
  cloudflared:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:latest
    container_name: immich_cloudflared
    restart: unless-stopped
    # HTTP/2 only — QUIC can flap when Happ VPN TUN adapter is active
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - default
