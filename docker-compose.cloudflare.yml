# Cloudflare Tunnel — remote HTTPS to Immich (upload optimizer on host :2283).
# Enable: COMPOSE_PROFILES=optimizer,cloudflare and set CLOUDFLARE_TUNNEL_TOKEN in .env
#
# Zero Trust → Public Hostname → HTTP → immich-upload-optimizer:2283 (same Docker network)
# Fallback if host :2283 blocked: use internal hostname, not host.docker.internal
# Docs: docs/REMOTE_ACCESS.md

services:
  cloudflared:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:latest
    container_name: immich_cloudflared
    restart: unless-stopped
    env_file:
      - .env
    # http2: works when firewall blocks outbound QUIC/TCP 7844 (common on Windows)
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - default
