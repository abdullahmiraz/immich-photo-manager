# Immich — Docker Desktop (Windows). All settings via Admin UI (no config file).
# https://docs.immich.app/install/docker-compose
name: immich

services:
  # Upload proxy: compresses images before they reach immich-server (http://localhost:2283)
  immich-upload-optimizer:
    container_name: immich_upload_optimizer
    image: ghcr.io/miguelangel-nubla/immich-upload-optimizer:${IUO_VERSION:-latest}
    ports:
      - "${IMMICH_HOST_PORT:-2283}:2283"
    volumes:
      - ${IUO_CONFIG_DIR:-./optimizer-config}:/config:ro
    environment:
      IUO_UPSTREAM: http://immich-server:2283
      IUO_TASKS_FILE: /config/tasks.yaml
    depends_on:
      immich-server:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: ${IUO_MEM_LIMIT:-2g}
    cpus: ${IUO_CPUS:-4}

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    env_file:
      - .env
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      REDIS_HOSTNAME: redis
      DB_STORAGE_TYPE: SSD
      IMMICH_PORT: "2283"
      # Cap cores Immich uses for job scheduling (Xeon 12C — avoid oversubscription)
      CPU_CORES: ${IMMICH_CPU_CORES:-8}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - ${EXTERNAL_LIBRARY_PATH}:/photos-import:ro
    # Port 2283 exposed only via immich-upload-optimizer (not host-mapped here)
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      disable: false

  # GPU-first ML (release-rocm). On WSL, if HIP cannot see the GPU, ONNX falls back to CPU automatically.
  # After reboot: .\scripts\enable-wsl-gpu.ps1 — verify logs lack "Falling back to ['CPUExecutionProvider']".
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-rocm
    env_file:
      - .env
    group_add:
      - video
    devices:
      - /dev/dri:/dev/dri
      - /dev/dxg:/dev/dxg
    volumes:
      - ${MODEL_CACHE_LOCATION}:/cache
      - /usr/lib/wsl/lib/libdxcore.so:/usr/lib/libdxcore.so:ro
    environment:
      IMMICH_PORT: "3003"
      HSA_OVERRIDE_GFX_VERSION: ${HSA_OVERRIDE_GFX_VERSION:-10.3.0}
      HSA_USE_SVM: ${HSA_USE_SVM:-0}
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      disable: false
    mem_limit: ${ML_MEM_LIMIT_GPU:-8g}
    cpus: ${ML_CPUS_GPU:-6}

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
    command: >
      valkey-server
      --save 300 10
      --save 60 1000
      --appendonly yes
      --appendfsync everysec
    volumes:
      - ${REDIS_DATA_LOCATION}:/data
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      DB_STORAGE_TYPE: SSD
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 512mb
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
      - default
      - immich-deduper
    mem_limit: ${DB_MEM_LIMIT:-4g}

  # https://github.com/RazgrizHsu/immich-deduper — same-host setup
  immich-deduper:
    image: ${DEDUP_IMAGE:-razgrizhsu/immich-deduper:latest-cpu}
    container_name: immich_deduper
    env_file:
      - .env
    ports:
      - "${DEDUP_PORT:-8086}:8086"
    volumes:
      - ${DEDUP_DATA}:/app/data
      - ${DEDUP_DATA}/cache:/root/.cache/torch/
      - ${UPLOAD_LOCATION}:/immich:ro
    depends_on:
      qdrant:
        condition: service_started
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - immich-deduper
    mem_limit: ${DEDUP_MEM_LIMIT:-4g}
    cpus: ${DEDUP_CPUS:-4}

  qdrant:
    container_name: immich_deduper_qdrant
    image: qdrant/qdrant:v1.16.3
    restart: unless-stopped
    volumes:
      - ${DEDUP_DATA}/qdrant:/qdrant/storage
    networks:
      - immich-deduper
    mem_limit: ${QDRANT_MEM_LIMIT:-2g}

networks:
  immich-deduper:
    name: immich-deduper
