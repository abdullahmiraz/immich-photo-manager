# Immich tuned for Intel Xeon E5-2670 v3 (12C/24T) on Docker Desktop Windows.
# ML: ROCm on AMD GPU (RX 580) or OpenVINO fallback.
name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    env_file:
      - .env
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      REDIS_HOSTNAME: redis
      CPU_CORES: ${CPU_CORES}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - ${EXTERNAL_LIBRARY_PATH}:/photos-import:ro
    ports:
      - "2283:2283"
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const http = require(''http''); const req = http.get(''http://localhost:2283/api/health'', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on(''error'', () => process.exit(1));"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-openvino
    env_file:
      - .env
    cap_add:
      - SYS_NICE
    # For AMD ROCm test: docker compose -f docker-compose.yml -f docker-compose.gpu-test.yml up -d --force-recreate immich-machine-learning
    volumes:
      - model-cache:/cache
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:3003/health'')" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
    command: >
      valkey-server
      --save 300 10
      --save 60 1000
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redisdata:/data
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: redis-cli ping || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    restart: unless-stopped
    stop_grace_period: 1m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE_NAME} || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  model-cache:
  pgdata:
  redisdata:
