# Immich — Docker Desktop (Windows). Settings via Admin UI (no config file).
# https://docs.immich.app/install/docker-compose
#
# Core Immich stack below. Add-ons (same folder — paths in .env stay ./library, ./data, …):
#   docker-compose.deduper.yml    — immich-deduper + Qdrant (included by default)
#   docker-compose.optimizer.yml  — upload compression (--profile optimizer)
#   docker-compose.cloudflare.yml — Cloudflare Tunnel (--profile cloudflare)
#
# Playbooks: docs/RECIPES.md
#
# Required containers (do not remove via prune/down — update only):
#   immich_server, immich_machine_learning, immich_postgres, immich_redis,
#   immich_deduper, immich_deduper_qdrant
# Upgrade: docker compose pull && docker compose up -d

name: immich

include:
  - path: docker-compose.deduper.yml
  # - path: docker-compose.optimizer.yml
  # - path: docker-compose.cloudflare.yml

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    env_file:
      - .env
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      REDIS_HOSTNAME: redis
      DB_STORAGE_TYPE: SSD
      IMMICH_PORT: "2283"
      CPU_CORES: ${IMMICH_CPU_CORES:-8}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      # Behind Cloudflare Tunnel / reverse proxy (see docs/REMOTE_ACCESS.md)
      IMMICH_TRUSTED_PROXIES: ${IMMICH_TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,127.0.0.1,::1}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - ${EXTERNAL_LIBRARY_PATH}:/photos-import:ro
    ports:
      - "${IMMICH_HOST_PORT:-2283}:2283"
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    env_file:
      - .env
    volumes:
      - ${MODEL_CACHE_LOCATION}:/cache
    environment:
      IMMICH_PORT: "3003"
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      disable: false
    mem_limit: ${ML_MEM_LIMIT:-6g}
    cpus: ${ML_CPUS:-4}

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
    command: >
      valkey-server
      --save 300 10
      --save 60 1000
      --appendonly yes
      --appendfsync everysec
    volumes:
      - ${REDIS_DATA_LOCATION}:/data
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      DB_STORAGE_TYPE: SSD
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 512mb
    restart: unless-stopped
    healthcheck:
      disable: false
    mem_limit: ${DB_MEM_LIMIT:-4g}
