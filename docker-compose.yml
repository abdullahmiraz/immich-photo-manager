# Hardcoded Windows Fix for Immich
name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:release
    env_file:
      - .env
    environment:
      DB_HOSTNAME: database
      DB_PASSWORD: immich_secret_password_123
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
    volumes:
      - ./library:/data
      - D:/code/duplicate image remover/immich/library/upload/external:/photos-import:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "2283:2283"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/server-info/ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:release-openvino
    env_file:
      - .env
    devices:
      - /dev/dxg:/dev/dxg
    volumes:
      - model-cache:/cache
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib
    environment:
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/ms-health-check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s  # Prevents container health flapping during intensive duplicate checks

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: immich_secret_password_123
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 512mb  # Expanded to prevent crashes during large vector duplicate queries
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=\"$$POSTGRES_DB\" --username=\"$$POSTGRES_USER\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  model-cache:
  pgdata: