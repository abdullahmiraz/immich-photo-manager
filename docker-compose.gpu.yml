# Optional GPU overlay for AMD RX 580 on Windows Docker Desktop (WSL2).
# Usage:
#   .\scripts\enable-wsl-gpu.ps1
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --force-recreate immich-machine-learning
#
# Revert to CPU:
#   docker compose up -d --force-recreate immich-machine-learning

services:
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-rocm
    extends:
      file: hwaccel.ml.yml
      service: rocm-wsl
    environment:
      # Polaris RX 580 (gfx803) — unofficial ROCm; may need tuning
      HSA_OVERRIDE_GFX_VERSION: ${HSA_OVERRIDE_GFX_VERSION:-10.3.0}
      HSA_USE_SVM: ${HSA_USE_SVM:-0}
      # Slightly higher than CPU-only; GPU does inference
      MACHINE_LEARNING_REQUEST_THREADS: ${MACHINE_LEARNING_REQUEST_THREADS_GPU:-6}
      MACHINE_LEARNING_MODEL_INTRA_OP_THREADS: 2
      MACHINE_LEARNING_MODEL_INTER_OP_THREADS: 1
      MACHINE_LEARNING_WORKERS: 1
    mem_limit: ${ML_MEM_LIMIT_GPU:-8g}
    cpus: ${ML_CPUS_GPU:-6}
