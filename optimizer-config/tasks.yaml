# Lossy image compression before Immich stores files (Caesium CLI in IUO image).
# JPEG/PNG/WebP/GIF/TIFF: q=85, EXIF + dates preserved. Other images + all videos: passthrough.
# See: https://github.com/miguelangel-nubla/immich-upload-optimizer/blob/main/TASKS.md

tasks:
  - name: caesium-lossy-85
    command: caesiumclt --keep-dates --exif --quality=85 --output={{.folder}} {{.folder}}/{{.name}}.{{.extension}}
    extensions:
      - jpeg
      - jpg
      - JPEG
      - JPG
      - png
      - PNG
      - webp
      - WEBP
      - gif
      - GIF
      - tiff
      - tif
      - TIFF
      - TIF

  # Formats Immich accepts but Caesium does not recompress — upload unchanged.
  - name: passthrough-images
    command: ""
    extensions:
      - avif
      - bmp
      - heic
      - heif
      - insp
      - jxl
      - psd
      - raw
      - rw2
      - svg
      - pgx
      - pam
      - pnm
      - pgm
      - ppm
      - pfm
      - exr

  # Videos unchanged (no HandBrake — stable under parallel uploads).
  - name: passthrough-videos
    command: ""
    extensions:
      - 3gp
      - 3gpp
      - avi
      - AVI
      - flv
      - FLV
      - m4v
      - M4V
      - mkv
      - MKV
      - mts
      - m2ts
      - m2t
      - mp4
      - MP4
      - insv
      - mpg
      - mpe
      - mpeg
      - mov
      - MOV
      - webm
      - WEBM
      - wmv
      - WMV
