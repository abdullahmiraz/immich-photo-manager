    image: ${IUO_IMAGE:-abdullahmiraz/immich-upload-optimizer-patched:v0.5.3}

  immich-deduper:
    image: ${DEDUP_IMAGE:-razgrizhsu/immich-deduper:latest-cpu}

  qdrant:
