# EXPERIMENTAL: AMD RX 580 GPU test on Docker Desktop (WSL2).
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu-test.yml up -d --force-recreate immich-machine-learning
# Revert: docker compose up -d --force-recreate immich-machine-learning  (without this file)
# RX 580 (gfx803) is NOT in official ROCm support lists — expect failure; this is for testing only.

services:
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-rocm
    devices:
      - /dev/dxg:/dev/dxg
    volumes:
      - model-cache:/cache
      - /usr/lib/wsl/lib/libdxcore.so:/usr/lib/libdxcore.so:ro
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
    environment:
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
      HSA_OVERRIDE_GFX_VERSION: "8.0.3"
      ROC_ENABLE_PRE_VEGA: "1"
      MACHINE_LEARNING_REQUEST_THREADS: 4
      MACHINE_LEARNING_WORKER_TIMEOUT: 300
